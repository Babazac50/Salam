<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; background: #f4f4f4; }
    .login-box { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    input { width: 100%; margin-bottom: 1rem; padding: 0.5rem; }
    button { background: #ff6b6b; color: #fff; padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #e65c5c; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Admin Login</h2>
    <form onsubmit="login(event)">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
      <p id="msg"></p>
    </form>
  </div>
  <script>
    function login(event) {
      event.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const msg = document.getElementById('msg');
      if(email === "arafat30issah@outlook.com" && password === "OnlembehkingbGh") {
        msg.textContent = "Login successful!";
        msg.style.color = "green";
      } else {
        msg.textContent = "Invalid credentials.";
        msg.style.color = "red";
      }
    }
  </script>
</body>
</html>
